<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/components/seo.js"
        data-title="Settings | SoftBridge Labs — Laboratory Customization"
        data-desc="Customize your SoftBridge Labs experience. Switch themes and manage your laboratory preferences."
        data-url="/settings/"
        data-robots="noindex, follow"
    ></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/style.css">

<body>
    <div id="header-placeholder"></div>

    <section class="hero hero-small">
        <div class="hero-bg-wrapper">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="/assets/backgrounds/videos/settings.mp4" type="video/mp4">
            </video>
            <img src="/assets/backgrounds/settings.jpg" alt="Settings Background" class="hero-img">
        </div>
        <div class="hero-content">
            <div class="badge">LABORATORY CONFIGURATION</div>
            <h1 class="hero-title">Laboratory <span style="color: var(--accent);">Settings</span></h1>
            <p class="hero-subtitle">Optimize your research environment and ecosystem preferences.</p>
        </div>
    </section>

    <main class="settings-container">
        <div class="setting-group">
            <div class="setting-info">
                <h3>Visual Theme</h3>
                <p>Switch between light and dark modes for laboratory research.</p>
            </div>
            <div class="theme-toggle-group">
                <div class="theme-pill" id="theme-pill"></div>
                <button class="theme-btn" id="light-theme-btn">
                    <span class="material-symbols-outlined">light_mode</span>
                    Light
                </button>
                <button class="theme-btn" id="dark-theme-btn">
                    <span class="material-symbols-outlined">dark_mode</span>
                    Dark
                </button>
            </div>
        </div>

        <div class="setting-group">
            <div class="setting-info">
                <h3>Laboratory Cache</h3>
                <p>Storage status of videos and high-definition assets.</p>
            </div>
            <div id="cache-status" style="font-weight: 700; color: var(--accent);">
                Optimized
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>


    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lightBtn = document.getElementById('light-theme-btn');
            const darkBtn = document.getElementById('dark-theme-btn');

            // Set initial active state
            const currentTheme = localStorage.getItem('softbridge-theme') || 'light';

            const updateUI = (theme) => {
                // Use the global updateTheme function from script.js if available, or fall back
                if (window.updateTheme) {
                    window.updateTheme(theme);
                } else {
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('softbridge-theme', theme);
                }

                // Toggle active classes for visual feedback
                if (lightBtn && darkBtn) {
                    lightBtn.classList.toggle('active', theme === 'light');
                    darkBtn.classList.toggle('active', theme === 'dark');
                }
            };

            // Initialize UI
            updateUI(currentTheme);

            if (lightBtn) lightBtn.addEventListener('click', () => updateUI('light'));
            if (darkBtn) darkBtn.addEventListener('click', () => updateUI('dark'));
        });
    </script>
</body>

</html>
