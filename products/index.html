<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | SoftBridge Labs - Our Software Ecosystem & Apps</title>
    <meta name="description"
        content="Explore the full suite of products by SoftBridge Labs. High-performance Android apps, developer utilities, and AI-powered tools. Trusted by users in 190+ countries.">
    <meta name="keywords"
        content="SoftBridge Labs products, SoftBridge apps, softbridge software, mobile apps, developer tools, HTML Editor PRO, Android apps, SoftBridge ecosystem, ProTec Games apps">
    <meta name="author" content="SoftBridge Labs">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="theme-color" content="#4f46e5">
    <link rel="canonical" href="https://softbridgelabs.in/products/">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SoftBridge Labs">
    <meta property="og:url" content="https://softbridgelabs.in/products/">
    <meta property="og:title" content="Products | SoftBridge Labs - Software Ecosystem & Apps">
    <meta property="og:description"
        content="Explore the full suite of products by SoftBridge Labs — high-performance apps and developer tools trusted by users in 190+ countries.">
    <meta property="og:image" content="https://softbridgelabs.in/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SoftBridge Labs Products">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@softbridgelabs">
    <meta name="twitter:url" content="https://softbridgelabs.in/products/">
    <meta name="twitter:title" content="Products | SoftBridge Labs - Software Ecosystem & Apps">
    <meta name="twitter:description"
        content="Explore the full suite of products by SoftBridge Labs — high-performance apps and developer tools trusted by users in 190+ countries.">
    <meta name="twitter:image" content="https://softbridgelabs.in/assets/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "SoftBridge Labs Products",
      "url": "https://softbridgelabs.in/products/",
      "description": "The complete software catalog of SoftBridge Labs — high-performance apps, developer tools, and AI-powered utilities.",
      "publisher": {
        "@type": "Organization",
        "name": "SoftBridge Labs",
        "url": "https://softbridgelabs.in",
        "logo": "https://softbridgelabs.in/assets/favicon.ico"
      }
    }
    </script>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/style.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-REJY59WGSQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-REJY59WGSQ');
    </script>
</head>

<body>
    <div id="header-placeholder"></div>

    <section class="hero hero-small">
        <div class="hero-bg-wrapper">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="/assets/backgrounds/videos/products.mp4" type="video/mp4">
            </video>
            <img src="/assets/backgrounds/products.jpg" alt="Products Hero" class="hero-img">
        </div>
        <div class="hero-content">
            <h1 class="hero-title">Our <span style="color: var(--accent);">Products</span></h1>
            <p class="hero-subtitle" style="margin-top: 16px;">Precision-engineered solutions for the digital age</p>
        </div>
    </section>

    <main style="padding: 60px 24px; max-width: 1200px; margin: 0 auto;">
        <section>
            <h2 class="section-title">Software Catalog</h2>
            <div id="full-products-list" class="bento-grid-legacy" style="margin-top: 40px;">
                <!-- Dynamic Content -->
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>


    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('full-products-list');

            fetch('/data/products.json')
                .then(res => res.json())
                .then(data => {
                    if (listContainer) {
                        listContainer.innerHTML = data.map((p, index) => `
                            <div class="bento-card" style="animation-delay: ${index * 0.1}s; display: flex; flex-direction: column;">
                                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                                    <img src="${p.icon}" alt="${p.name}" style="width: 60px; height: 60px; border-radius: 15px; object-fit: contain; background: var(--card-bg); padding: 6px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onerror="this.src='https://cdn-icons-png.flaticon.com/512/25/25231.png'">
                                    <h3 style="margin: 0; font-size: 1.5rem; color: var(--text);">${p.name}</h3>
                                </div>
                                <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; flex-grow: 1;">
                                    ${p.description || 'Built for performance and reliability.'}
                                </p>
                                <div style="margin-top: auto; display: flex; gap: 12px;">
                                    <a href="/apps/${p.id}" class="btn-black" style="display: inline-block; text-decoration: none; font-size: 0.9rem; padding: 12px 24px;">Explore Lab</a>
                                    <a href="${p.url}" target="_blank" rel="noopener noreferrer" style="display: inline-block; text-decoration: none; font-size: 0.9rem; padding: 12px 24px; border: 1px solid var(--border); border-radius: 12px; color: var(--text);">Launch</a>
                                </div>
                            </div>
                        `).join('');
                    }
                })
                .catch(err => {
                    if (listContainer) listContainer.innerHTML = '<p>Failed to load products. Please try again later.</p>';
                });
        });
    </script>
</body>

</html>
