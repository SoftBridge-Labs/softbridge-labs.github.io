<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/components/seo.js"
        data-title="Products | SoftBridge Labs — Software Ecosystem & Apps"
        data-desc="Explore the full suite of products by SoftBridge Labs. High-performance Android apps, developer utilities, and AI-powered tools trusted by users in 190+ countries."
        data-url="/products/"
        data-type="website"
        data-keywords="SoftBridge Labs products, SoftBridge apps, mobile apps India, developer tools, HTML Editor PRO, Android apps, AI tools"
    ></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/style.css">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"CollectionPage","name":"SoftBridge Labs Products","url":"https://softbridgelabs.in/products/","description":"The complete software catalog of SoftBridge Labs — high-performance apps, developer tools, and AI-powered utilities.","publisher":{"@type":"Organization","name":"SoftBridge Labs","url":"https://softbridgelabs.in"}}
    </script>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="hero hero-small">
        <div class="hero-bg-wrapper">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="/assets/backgrounds/videos/products.mp4" type="video/mp4">
            </video>
            <img src="/assets/backgrounds/products.jpg" alt="Products Hero" class="hero-img">
        </div>
        <div class="hero-content">
            <h1 class="hero-title">Our <span style="color: var(--accent);">Products</span></h1>
            <p class="hero-subtitle" style="margin-top: 16px;">Precision-engineered solutions for the digital age</p>
        </div>
    </section>

    <main style="padding: 60px 24px; max-width: 1200px; margin: 0 auto;">
        <section>
            <h2 class="section-title">Software Catalog</h2>
            <div id="full-products-list" class="bento-grid-legacy" style="margin-top: 40px;">
                <!-- Dynamic Content -->
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>


    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('full-products-list');

            fetch('/data/products.json')
                .then(res => res.json())
                .then(data => {
                    if (listContainer) {
                        listContainer.innerHTML = data.map((p, index) => `
                            <div class="bento-card" style="animation-delay: ${index * 0.1}s; display: flex; flex-direction: column;">
                                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                                    <img src="${p.icon}" alt="${p.name}" style="width: 60px; height: 60px; border-radius: 15px; object-fit: contain; background: var(--card-bg); padding: 6px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onerror="this.src='https://cdn-icons-png.flaticon.com/512/25/25231.png'">
                                    <h3 style="margin: 0; font-size: 1.5rem; color: var(--text);">${p.name}</h3>
                                </div>
                                <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; flex-grow: 1;">
                                    ${p.description || 'Built for performance and reliability.'}
                                </p>
                                <div style="margin-top: auto; display: flex; gap: 12px;">
                                    <a href="/apps/${p.id}" class="btn-black" style="display: inline-block; text-decoration: none; font-size: 0.9rem; padding: 12px 24px;">Explore Lab</a>
                                    <a href="${p.url}" target="_blank" rel="noopener noreferrer" style="display: inline-block; text-decoration: none; font-size: 0.9rem; padding: 12px 24px; border: 1px solid var(--border); border-radius: 12px; color: var(--text);">Launch</a>
                                </div>
                            </div>
                        `).join('');
                    }
                })
                .catch(err => {
                    if (listContainer) listContainer.innerHTML = '<p>Failed to load products. Please try again later.</p>';
                });
        });
    </script>
</body>

</html>
