<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | SoftBridge Labs - Engineering Insights & Tech Updates</title>
    <meta name="description"
        content="Read the latest insights on AI, web development, mobile apps, and software engineering from the SoftBridge Labs team. Deep-dives, tutorials, and lab updates.">
    <meta name="keywords"
        content="SoftBridge Labs blog, SoftBridge tech insights, software engineering blog, AI blog, developer blog India, SoftBridge articles, ProTec Games blog">
    <meta name="author" content="SoftBridge Labs">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="theme-color" content="#4f46e5">
    <link rel="canonical" href="https://softbridgelabs.in/blog/">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SoftBridge Labs">
    <meta property="og:url" content="https://softbridgelabs.in/blog/">
    <meta property="og:title" content="Blog | SoftBridge Labs - Engineering Insights & Tech Updates">
    <meta property="og:description"
        content="Insights, tutorials, and updates from the leading edge of technology by SoftBridge Labs.">
    <meta property="og:image" content="https://softbridgelabs.in/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SoftBridge Labs Blog">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@softbridgelabs">
    <meta name="twitter:url" content="https://softbridgelabs.in/blog/">
    <meta name="twitter:title" content="Blog | SoftBridge Labs - Engineering Insights & Tech Updates">
    <meta name="twitter:description"
        content="Insights, tutorials, and updates from the leading edge of technology by SoftBridge Labs.">
    <meta name="twitter:image" content="https://softbridgelabs.in/assets/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "SoftBridge Labs Blog",
      "url": "https://softbridgelabs.in/blog/",
      "description": "Engineering insights, AI tutorials, and software updates from the SoftBridge Labs team.",
      "publisher": {
        "@type": "Organization",
        "name": "SoftBridge Labs",
        "url": "https://softbridgelabs.in",
        "logo": "https://softbridgelabs.in/assets/favicon.ico"
      }
    }
    </script>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="/style.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-REJY59WGSQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-REJY59WGSQ');
    </script>
    <style>
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
            margin-top: 60px;
        }

        .blog-card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .blog-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            border-color: var(--accent);
        }

        .blog-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .blog-card-content {
            padding: 32px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-tag {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .blog-card h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            line-height: 1.3;
            color: var(--text);
        }

        .blog-card p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .blog-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .loading-shimmer {
            height: 400px;
            background: linear-gradient(90deg, var(--card-bg) 25%, var(--hover-bg) 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 24px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <section class="hero hero-small">
        <div class="hero-bg-wrapper">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="/assets/backgrounds/videos/blog.mp4" type="video/mp4">
            </video>
            <img src="/assets/backgrounds/blog.jpg" alt="Blog Hero" class="hero-img">
        </div>
        <div class="hero-content">
            <h1 class="hero-title">The <span style="color: var(--accent);">Laboratory</span> Blog</h1>
            <p class="hero-subtitle" style="margin-top: 16px;">Engineering insights, technical deep-dives, and
                laboratory updates.</p>
        </div>
    </section>

    <main style="padding: 100px 24px; max-width: 1200px; margin: 0 auto;">
        <div id="blog-container" class="blog-grid">
            <div class="loading-shimmer"></div>
            <div class="loading-shimmer"></div>
            <div class="loading-shimmer"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>


    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const blogContainer = document.getElementById('blog-container');

            fetch('https://dev.to/api/articles?username=protecstudio')
                .then(res => res.json())
                .then(articles => {
                    blogContainer.innerHTML = articles.map(article => `
                        <a href="/blog/article.html?id=${article.id}" class="blog-card" style="animation: fadeInUp 0.8s ease backwards;">
                            <img src="${article.cover_image || article.social_image || 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=2070&auto=format&fit=crop'}" alt="${article.title}">
                            <div class="blog-card-content">
                                <span class="blog-tag">${article.tag_list[0] || 'Technology'}</span>
                                <h3>${article.title}</h3>
                                <p>${article.description}</p>
                                <div class="blog-meta">
                                    <span class="material-symbols-outlined" style="font-size: 1.2rem;">calendar_today</span>
                                    <span>${new Date(article.published_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                                    <span style="margin-left: auto; display: flex; align-items: center; gap: 4px;">
                                        <span class="material-symbols-outlined" style="font-size: 1.2rem;">visibility</span>
                                        ${article.page_views_count || 'View'}
                                    </span>
                                </div>
                            </div>
                        </a>
                    `).join('');
                })
                .catch(err => {
                    blogContainer.innerHTML = '<p>Laboratory transmission interrupted. Failed to load articles.</p>';
                    console.error(err);
                });
        });
    </script>
</body>

</html>
