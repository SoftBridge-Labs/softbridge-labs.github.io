        data-title="Dev Tools | SoftBridge Labs — Professional Developer Utilities"
        data-desc="Explore professional developer utilities by SoftBridge Labs. AI-powered code editors, open-source SDKs, and API libraries. Free and premium tools for modern developers."
        data-url="/devtools/"
        data-type="website"
        data-keywords="SoftBridge Labs dev tools, HTML Editor PRO, open source SDK, developer utilities India, code editor Android, GitLook, SafeMe, GF Model"

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/style.css">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"CollectionPage","name":"SoftBridge Labs Developer Tools","url":"https://softbridgelabs.in/devtools/","description":"Professional developer utilities, open-source SDKs, and AI-powered coding tools from SoftBridge Labs.","publisher":{"@type":"Organization","name":"SoftBridge Labs","url":"https://softbridgelabs.in"}}
    </script>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NZGDGVDB"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

    <div id="header-placeholder"></div>

    <section class="hero hero-small">
        <div class="hero-bg-wrapper">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="/assets/backgrounds/videos/devtools.mp4" type="video/mp4">
            </video>
            <img src="/assets/backgrounds/devtools.jpg" alt="Dev Tools Hero" class="hero-img">
        </div>
        <div class="hero-content">
            <h1 class="hero-title">Developer <span style="color: var(--accent);">Utilities</span></h1>
            <p class="hero-subtitle" style="margin-top: 16px;">Professional-grade tools engineered for the modern
                laboratory</p>
        </div>
    </section>

    <main style="padding: 60px 24px; max-width: 1200px; margin: 0 auto;">
        <div id="devtools-list" class="bento-grid"
            style="margin-top: 40px; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));">
            <!-- Dynamic Content -->
        </div>
    </main>

    <div id="footer-placeholder"></div>


    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('devtools-list');

            fetch('/data/devtools.json')
                .then(res => res.json())
                .then(data => {
                    if (listContainer) {
                        listContainer.innerHTML = data.map((p, index) => `
                            <div class="bento-card" style="animation-delay: ${index * 0.1}s; display: flex; flex-direction: column; padding: 40px;">
                                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
                                    <img src="${p.icon}" alt="${p.name}" style="width: 60px; height: 60px; border-radius: 15px; object-fit: contain; background: var(--card-bg); padding: 6px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onerror="this.src='https://cdn-icons-png.flaticon.com/512/25/25231.png'">
                                    <h3 style="margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--text);">${p.name}</h3>
                                </div>
                                <p style="color: var(--text-muted); line-height: 1.7; margin-bottom: 32px; flex-grow: 1; font-size: 1rem;">
                                    ${p.description}
                                </p>
                                <div style="margin-top: auto; display: flex; gap: 12px;">
                                    <a href="/apps/${p.id}" class="btn-black" style="display: inline-block; text-decoration: none; font-size: 0.9rem; padding: 12px 28px;">Research Lab</a>
                                    <a href="${p.url}" target="_blank" rel="noopener noreferrer" style="display: inline-block; text-decoration: none; font-size: 0.9rem; padding: 12px 28px; border: 1px solid var(--border); border-radius: 12px; color: var(--text);">Access</a>
                                </div>
                            </div>
                        `).join('');
                    }
                })
                .catch(err => {
                    if (listContainer) listContainer.innerHTML = '<p>Laboratory transmission interrupted. Failed to load tools.</p>';
                });
        });
    </script>
</body>

</html>
