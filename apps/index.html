<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/components/seo.js"
        data-title="Application Laboratory | SoftBridge Labs — All Software & Tools"
        data-desc="Browse the complete catalog of apps, developer tools, and software experiments by SoftBridge Labs. Android apps, AI tools, open-source utilities and more."
        data-url="/apps/"
        data-type="website"
        data-keywords="SoftBridge Labs apps, all software, Android apps India, developer tools catalog, AiDroid, HTML Editor PRO, CommitAds, Karbon Sites"
    ></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="/style.css">

<body>
    <div id="header-placeholder"></div>

    <section class="hero hero-small">
        <div class="hero-bg-wrapper">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="/assets/backgrounds/videos/devtools.mp4" type="video/mp4">
            </video>
            <img src="/assets/backgrounds/devtools.jpg" alt="Laboratory Background" class="hero-img">
        </div>
        <div class="hero-content">
            <div class="badge">ECOSYSTEM CATALOG</div>
            <h1 class="hero-title">Application <span style="color: var(--accent);">Laboratory</span></h1>
            <p class="hero-subtitle" style="margin-top: 16px;">The complete repository of SoftBridge software and
                utilities</p>
        </div>
    </section>

    <main style="padding: 60px 24px; max-width: 1200px; margin: 0 auto;">
        <div id="full-catalog-list" class="bento-grid"
            style="margin-top: 40px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
            <!-- Dynamic Content -->
            <div style="grid-column: 1/-1; text-align: center; padding: 100px;">
                <p>Acquiring laboratory signals...</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>


    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('full-catalog-list');

            Promise.all([
                fetch('/data/products.json').then(res => res.json()),
                fetch('/data/devtools.json').then(res => res.json())
            ]).then(([products, devtools]) => {
                const results = [...products, ...devtools];
                if (listContainer) {
                    listContainer.innerHTML = results.map((p, index) => `
                        <a href="/apps/${p.id}/" class="bento-card" style="animation-delay: ${index * 0.05}s; display: flex; flex-direction: column; padding: 32px; text-decoration: none; color: inherit;">
                            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
                                <img src="${p.icon}" alt="${p.name}" style="width: 50px; height: 50px; border-radius: 12px; object-fit: contain; background: var(--card-bg); padding: 5px; border: 1px solid var(--border);" onerror="this.src='https://cdn-icons-png.flaticon.com/512/25/25231.png'">
                                <h3 style="margin: 0; font-size: 1.3rem; font-weight: 700; color: var(--text);">${p.name}</h3>
                            </div>
                            <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; flex-grow: 1; font-size: 0.95rem;">
                                ${p.description}
                            </p>
                            <div style="margin-top: auto; display: flex; align-items: center; color: var(--accent); font-weight: 700; font-size: 0.9rem; gap: 8px;">
                                View Lab Data <span class="material-symbols-outlined" style="font-size: 1.2rem;">arrow_forward</span>
                            </div>
                        </a>
                    `).join('');
                }
            }).catch(err => {
                if (listContainer) listContainer.innerHTML = '<p>Laboratory data corruption detected. Please reload.</p>';
            });
        });
    </script>
</body>

</html>
